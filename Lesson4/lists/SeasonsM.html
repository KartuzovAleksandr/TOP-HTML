<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Seasons Maxim</title>

    <style>
        #winter li::marker { content: "❄ "; color: rgb(0, 0, 200); }
        #spring li::marker { content: "🍃 "; color: rgb(0, 190, 0); }
        #summer li::marker { content: "☀ "; color: #ffb700; }
        #autumn li::marker { content: "🍂 "; color: #d96c00; }
    </style>
</head>

<body>
    <ul id="winter">
        <li>Декабрь</li>
        <li>Январь</li>
        <li>Февраль</li>
    </ul>

    <ul id="spring">
        <li>Март</li>
        <li>Апрель</li>
        <li>Май</li>
    </ul>

    <ul id="summer">
        <li>Июнь</li>
        <li>Июль</li>
        <li>Август</li>
    </ul>

    <ul id="autumn">
        <li>Сентябрь</li>
        <li>Октябрь</li>
        <li>Ноябрь</li>
    </ul>
</body>
</html>
