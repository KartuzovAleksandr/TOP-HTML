<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Фильмы</title>
        <style>
            table {
                width: 80%;
                border-collapse: collapse;
                margin: auto;
            }
            th, td {
                border: solid 1px #ddd;
                padding: 5px;
                text-align: center;
            }
            th {
                background: lightgray;
                font-weight: bold;
                font-style: italic;
            }
            tbody tr:nth-child(odd) {
                background: lightgreen;
            }
        </style>
    </head>
    <body>
        <table>
            <caption>Рейтинг</caption>
            <thead>
                <tr>
                    <th>Место</th>
                    <th>Фильм</th>
                    <th>Оценка</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Хищник</td>
                    <td>8.5</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Аватар</td>
                    <td>7.5</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Иллюзия обмана 3</td>
                    <td>7.2</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>Голосовой помощник</td>
                    <td>5.2</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
