<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap меню с подсветкой</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .nav-link.active {
      color: #0d6efd; /* Цвет подсветки активного пункта */
      font-weight: bold;
      border-bottom: 2px solid #0d6efd;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-light">
    <div class="container">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="menu">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Главная</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Пункт 1</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Пункт 2</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Пункт 3</a>
        </li>
      </ul>
    </div>
  </nav>

  <script>
    // Скрипт для переключения подсветки активного пункта меню при клике
    document.querySelectorAll('#menu .nav-link').forEach(link => {
      link.addEventListener('click', function() {
        document.querySelectorAll('#menu .nav-link').forEach(el => el.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
