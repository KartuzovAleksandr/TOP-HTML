<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Send message to us</title>
    <link rel="stylesheet" href="styles_m.css" />
  </head>

  <body>
    <h3>We need your opinion!</h3>
    <form>
      <div class="mat-input">
        <label for="uname">Name:</label>
        <input type="text" id="uname" name="userName" placeholder="Имя" />
      </div>
      <div>
        <label for="email">Email:</label>
        <input type="text" id="email" name="userEmail" />
      </div>
      <div>
        <label for="message">Message:</label>
        <textarea id="message" name="userMessage"></textarea>
      </div>
      <div>
        <button type="submit">Send my message</button>
      </div>
    </form>
  </body>
</html>
