<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Формы 2026</title>
    </head>
    <body>
        <form method="get">
            <label>Введите имя</label>
            <input type="text" name="username" placeholder="Логин">
            <p>
            <label>Пароль</label>
            <input type="password" name="password" placeholder="Пароль">
            <p>
            <label>Email</label>
            <input type="email" name="email" placeholder="Почта">
            <p>
            <label>Возраст</label>
            <input type="number" min="18" max="80" step="5" name="age">
            <p>
            <label>Телефон</label>
            <input type="tel" name="phone" placeholder="">
            <p>
            <label>Сайт</label>
            <input type="url" name="site" placeholder="http://">
            <p>
            <label>Дата рождения</label>
            <input type="date" name="birthday">
            <br>
            <label>Время</label>
            <input type="time" name="birthday">
            <br>
            <label>Месяц</label>
            <input type="month">
            <br>
            <label>Неделя</label>
            <input type="week">
            <br>
            <label>Дата и время</label>
            <input title="Локальная дата время" type="datetime-local">
            <p>
            <input type="checkbox" name="isstudent" checked>Студент
            <p>
            <p>
            <input type="radio" name="gender" value="male">Мужской
            <input type="radio" name="gender" value="female">Женский
            <p>
            <input type="range" min="1" max="25" value="3">Опыт
            <p>
            <input type="button" value="Клик">
            <p>
            <input type="hidden" name="id" value="10">
            <p>
            <input type="submit">
            <input type="reset">
        </form>
    </body>
</html>
