<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Lift Press Button</title>
<style>
            .btn{
               background-color: green;
                margin-left: 30%;
                margin-top: 30%;
                box-shadow: 0 5px
            }
            .btn:active
            {
                box-shadow: 0 2px;
                transform: translateY(3px)
            }
</style>
</head>
<body>
<button class="btn">Нажми меня</button>
</body>
</html>
