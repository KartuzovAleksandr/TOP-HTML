<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flip Card Button</title>
<style>

        .flip-button {

            width: 200px;

            height: 60px;

            perspective: 600px;

            cursor: pointer;

        }

        .flip-card {

            width: 100%;

            height: 100%;

            position: relative;

            transform-style: preserve-3d;

            transition: transform 0.6s;

        }

        .flip-button:active .flip-card {

            transform: rotateX(180deg);

        }

        .card-face {

            position: absolute;

            width: 100%;

            height: 100%;

            backface-visibility: hidden;

            border-radius: 8px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

            font-size: 18px;

        }

        .card-front {

            background: #4a6fa5;

            color: white;

        }

        .card-back {

            background: #2ecc71;

            color: white;

            transform: rotateX(180deg);

        }

        .card-back::before {

            font-size: 24px;

            margin-right: 10px;

        }
</style>
</head>
<body>
<div class="flip-button">
<div class="flip-card">
<div class="card-face card-front">Нажми меня</div>
<div class="card-face card-back">Готово</div>
</div>
</div>
</body>
</html>
