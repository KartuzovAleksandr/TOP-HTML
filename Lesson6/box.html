<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Блоки и параграфы</title>
    </head>
    <body>
        Здравствуйте !
        <!-- p делает пустую строку -->
        <p>
        Как дела ?
        <!-- br не делает пустую строку -->
        <br>
        Сегодня теплее
        <!-- div тоже делает пустую строку -->
        <div>
            А завтра снег
        </div>
    </body>
</html>
